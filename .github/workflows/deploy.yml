name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - stage

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: stage
          path: stage

      - name: Build site structure
        run: |
          mkdir -p _site/scripts
          mkdir -p _site/stage/scripts

          # Copy main branch content to root
          cp main/CNAME _site/
          cp main/README.md _site/
          cp main/scripts/* _site/scripts/

          # Copy stage branch content to /stage/
          cp stage/scripts/* _site/stage/scripts/
          [ -f stage/README.md ] && cp stage/README.md _site/stage/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
