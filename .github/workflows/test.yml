name: Test

# Reports the status check named exactly `test`, which the org's main-branch
# ruleset requires on every pull request into main (CR: control-theory/docs#1218).
# Keep the job id and `name:` as `test`: renaming either one blocks every merge.
#
# This repo promotes through `stage`: enforce-stage-only.yml only lets `stage`
# open a PR into `main`. The workflow therefore also runs on PRs into `stage`,
# so a change is checked before it lands there, and it has to exist on `stage`
# for the stage -> main PR to report `test`.
on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      # Errors only: install.sh has many pre-existing warning-level findings
      # (SC2155 and similar) that are not worth failing the check over.
      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          shellcheck --severity=error scripts/*.sh
